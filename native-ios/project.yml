name: DANPERNative
options:
  bundleIdPrefix: pe.danper.saludmovil.native
  deploymentTarget:
    iOS: "17.0"
packages:
  DanperCore:
    path: .
targets:
  DANPERNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - N1sDemoResources/**
      - path: App/N1sDemoResources
        type: folder
    dependencies:
      - package: DanperCore
    preBuildScripts:
      - name: "Verificar catálogo de áreas DANPER"
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          ROOT="${PROJECT_DIR}/.."
          ASSET="${PROJECT_DIR}/App/N1sDemoResources/n2-organization-areas.json"
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          if [ ! -s "$ASSET" ] || [ "$ROOT/scripts/n2-official-area-catalog.cjs" -nt "$ASSET" ] || [ "$ROOT/src/ambulatoryTemplate.json" -nt "$ASSET" ]; then
            cd "$ROOT"
            if [ ! -d node_modules/fflate ]; then
              echo "error: Dependencias JavaScript ausentes. Ejecuta npm ci desde la raíz del proyecto."
              exit 1
            fi
            node scripts/prepare-n1s-ios-demo-resources.cjs
          fi
          if [ ! -s "$ASSET" ]; then
            echo "error: No se pudo generar el catálogo oficial de áreas."
            exit 1
          fi
          echo "Catálogo organizativo listo para el simulador."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.danper.saludmovil.native.preview
        PRODUCT_NAME: DANPERNative
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "11"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: es
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_CFBundleDisplayName: "DANPER Salud Móvil"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "DANPER Salud Móvil utiliza Face ID para restringir el acceso a la aplicación."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        CODE_SIGN_STYLE: Manual
    scheme:
      testTargets:
        - DANPERNativeTests
        - DANPERInteractionTests
  DANPERNativeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NativeTests
    dependencies:
      - target: DANPERNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.danper.saludmovil.native.preview.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DANPERNative.app/DANPERNative"
        BUNDLE_LOADER: "$(TEST_HOST)"

  DANPERInteractionTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: InteractionTests
    dependencies:
      - target: DANPERNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.danper.saludmovil.native.preview.interactiontests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: DANPERNative
