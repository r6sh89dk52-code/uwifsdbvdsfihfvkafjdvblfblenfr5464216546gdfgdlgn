name: DANPERNative
settings:
  base:
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: YES
options:
  bundleIdPrefix: pe.danper.saludmovil.native
  deploymentTarget:
    iOS: "17.0"
packages:
  DanperCore:
    path: .
targets:
  DANPERNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - N1sDemoResources/**
      - path: App/N1sDemoResources
        type: folder
    dependencies:
      - package: DanperCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.danper.saludmovil.native.n4dm.lab
        PRODUCT_NAME: DANPERNative
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "11"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: es
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_CFBundleDisplayName: "DANPER DM LAB"
        INFOPLIST_KEY_NSCameraUsageDescription: "Permite fotografiar certificados para reconocimiento local sin guardarlos en Fotos."\n        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Permite elegir imágenes de certificados sin copiar la foto a la app."\n        INFOPLIST_KEY_NSFaceIDUsageDescription: "DANPER Salud Móvil utiliza Face ID para restringir el acceso a la aplicación."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        # Use Xcode-managed development profiles for a physical iPhone.
        # The developer selects their own Team locally; never commit a
        # personal Team ID, signing identity or provisioning profile.
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - DANPERNativeTests
        - DANPERInteractionTests
  DANPERNativeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NativeTests
        excludes:
          - SyntheticFixtures/**
      - path: NativeTests/SyntheticFixtures
        type: folder
    dependencies:
      - target: DANPERNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.danper.saludmovil.native.n4dm.lab.tests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DANPERNative.app/DANPERNative"
        BUNDLE_LOADER: "$(TEST_HOST)"

  DANPERInteractionTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: InteractionTests
    dependencies:
      - target: DANPERNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.danper.saludmovil.native.n4dm.lab.interactiontests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: DANPERNative
