name: DANPERNative
options:
  bundleIdPrefix: pe.danper.saludmovil.native
  deploymentTarget:
    iOS: "17.0"
packages:
  DanperCore:
    path: .
targets:
  DANPERNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - N1sDemoResources/**
      - path: App/N1sDemoResources
        type: folder
    dependencies:
      - package: DanperCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.danper.saludmovil.native.preview
        PRODUCT_NAME: DANPERNative
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: es
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_CFBundleDisplayName: "DANPER Nativa Prueba"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "DANPER Salud Móvil utiliza Face ID para restringir el acceso a la aplicación."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        CODE_SIGN_STYLE: Manual
    scheme:
      testTargets:
        - DANPERNativeTests
        - DANPERInteractionTests
  DANPERNativeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NativeTests
    dependencies:
      - target: DANPERNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.danper.saludmovil.native.preview.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DANPERNative.app/DANPERNative"
        BUNDLE_LOADER: "$(TEST_HOST)"

  DANPERInteractionTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: InteractionTests
    dependencies:
      - target: DANPERNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.danper.saludmovil.native.preview.interactiontests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: DANPERNative
