name: B15 - natural LocalAuthentication UI diagnostic on exact e909ca6
on:
  push:
    branches: [audit/b15-profile-device-9143997-20261101]
    paths: [.github/workflows/b15-natural-auth-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  natural-auth:
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [N2BiometricInteractionTests, N3ClinicalJourneyTests-protected]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      DANPER_EXPECTED_BUILD: '15'
    steps:
      - uses: actions/checkout@v4
        with: {ref: e909ca6269fe3d8ae703b55683ccffb59544db13}
      - uses: actions/download-artifact@v4
        with:
          name: B15_COMPILED_SAME_HEAD
          run-id: 41386614435
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/b15-natural-compiled
      - name: Verify unchanged app and tests; let LocalAuthentication own its system UI
        env:
          PROOF_ROOT: ${{ runner.temp }}/b15-natural-proof
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b15-natural-derived/Build" "$PROOF_ROOT"
          tar -xzf "$RUNNER_TEMP/b15-natural-compiled/TEST_PRODUCTS.tgz" -C "$RUNNER_TEMP/b15-natural-derived/Build"
          python3 scripts/performance/test-products.py verify "$RUNNER_TEMP/b15-natural-derived/Build/Products" "$RUNNER_TEMP/b15-natural-compiled/TEST_PRODUCTS.json"
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path('scripts/glass-audit/prepare-auth-ui.sh');text=p.read_text()
          marker='# Current failed logs show CoreAuthUI starting AFTER'
          assert marker in text
          p.write_text(text[:text.index(marker)])
          root=Path(os.environ['PROOF_ROOT'])
          (root/'HARNESS.diff').write_bytes(subprocess.check_output(['git','diff','--','scripts/glass-audit/prepare-auth-ui.sh']))
          (root/'ORCHESTRATION_PROOF.json').write_text(json.dumps({'appSourceSHA':'e909ca6269fe3d8ae703b55683ccffb59544db13','workflowSHA':os.environ['GITHUB_SHA'],'compiledAppAndUITestsUnchanged':True,'change':'Remove external CoreAuthUI warm launch/terminate; genuine LocalAuthentication owns policy and system scene','sensorEventsAndAssertionsUnchanged':True,'diagnosticOnly':True},indent=2))
          PY
          bash -n scripts/glass-audit/prepare-auth-ui.sh
      - name: Run genuine preflight and all selected sensor-driven UI assertions
        env:
          DANPER_AUDIT_OUT: ${{ runner.temp }}/b15-natural-proof
          DANPER_AUDIT_DERIVED_DATA: ${{ runner.temp }}/b15-natural-derived
          DANPER_TEST_PROOF: ${{ runner.temp }}/b15-natural-compiled/TEST_PRODUCTS.json
          DANPER_B15_UI_LABEL: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          bash scripts/glass-audit/validate-macos.sh b15-shard
          python3 scripts/performance/verify-ui-shard.py "$DANPER_AUDIT_OUT" "$DANPER_B15_UI_LABEL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B15_NATURAL_AUTH_DIAGNOSTIC_${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/b15-natural-proof/*.json
            ${{ runner.temp }}/b15-natural-proof/*.txt
            ${{ runner.temp }}/b15-natural-proof/*.log
            ${{ runner.temp }}/b15-natural-proof/*.diff
          retention-days: 14
