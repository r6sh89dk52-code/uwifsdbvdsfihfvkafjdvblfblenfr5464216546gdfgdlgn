name: DANPER Native - Swift Core Linux
on:
  push:
    branches: [native/swiftui-n1s-complete-excel-and-container-gate]
    paths:
      - 'native-ios/**'
      - 'src/attentionStepValidation.ts'
      - 'scripts/generate-native-compat-fixtures.cjs'
      - 'scripts/generate-n1e-clinical-fixtures.cjs'
      - 'scripts/generate-n1f-lossless-fixtures.cjs'
      - 'scripts/generate-n1h-clinical-parity.cjs'
      - 'scripts/generate-n1p-excel-parity.cjs'
      - 'scripts/generate-n1q-reconciliation-fixtures.cjs'
      - 'scripts/generate-n1r-stored-xlsx-template.cjs'
      - 'scripts/test-n1r-native-xlsx.cjs'
      - 'scripts/generate-n1s-official-excel-fixtures.cjs'
      - 'scripts/test-n1s-full-native-workbooks.cjs'
      - 'scripts/test-n1s-one-click-container-consent.cjs'
      - 'scripts/generate-n2-approved-fixture.cjs'
      - 'scripts/generate-n2-nursing-parity.cjs'
      - 'scripts/generate-n2-stock-commands-fixtures.cjs'
      - 'src/automaticClinicalDispensing.ts'
      - 'src/ClinicalStockChoice.tsx'
      - 'src/main.tsx'
      - '.github/workflows/native-swift-linux.yml'
  pull_request:
    branches: [native/swiftui-n1s-complete-excel-and-container-gate]
    paths:
      - 'native-ios/**'
      - '.github/workflows/native-swift-linux.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  swift-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install synthetic fixture dependencies
        run: npm ci --no-fund --ignore-scripts
      - name: Generate entirely synthetic legacy interoperability fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/danper-n1-fixtures"
          echo "DANPER_N1_FIXTURE_DIR=$RUNNER_TEMP/danper-n1-fixtures" >> "$GITHUB_ENV"
          DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-n1-fixtures" node scripts/generate-native-compat-fixtures.cjs
          DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-n1-fixtures" node scripts/generate-n1e-clinical-fixtures.cjs
          DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-n1-fixtures" node scripts/generate-n1f-lossless-fixtures.cjs
          DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-n1-fixtures" node scripts/generate-n1h-clinical-parity.cjs
          DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-n1-fixtures" node scripts/generate-n1p-excel-parity.cjs
          DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-n1-fixtures" node scripts/generate-n1q-reconciliation-fixtures.cjs
          DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-n1-fixtures" node scripts/generate-n1r-stored-xlsx-template.cjs
          DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-n1-fixtures" node scripts/generate-n1s-official-excel-fixtures.cjs
          DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-n1-fixtures" node scripts/generate-n2-approved-fixture.cjs
          DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-n1-fixtures" node scripts/generate-n2-nursing-parity.cjs
          DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-n1-fixtures" node scripts/generate-n2-stock-commands-fixtures.cjs
      - name: Generate frozen build222 procedure equivalence cases
        run: node scripts/generate-n2-procedure-parity.cjs
      - name: Compile production TypeScript and verify one-click container opening
        run: |
          npm run build
          node scripts/test-automatic-clinical-dispensing.cjs
          node scripts/test-n1s-one-click-container-consent.cjs
      - name: Parse SwiftUI sources (syntax only; not UIKit/SwiftUI typecheck)
        run: swiftc -frontend -parse native-ios/App/*.swift
      - name: Swift tests including N1s both official full Excel workbooks and opening consent
        run: cd native-ios && swift test --jobs 2
      - name: Cross-verify native Swift XLSX against TypeScript A–AD
        run: DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-n1-fixtures" node scripts/test-n1r-native-xlsx.cjs
      - name: Compare both native Excel workbooks against TypeScript official originals
        run: DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-n1-fixtures" node scripts/test-n1s-full-native-workbooks.cjs
      - name: Guard zero macOS and no IPA generation
        run: |
          test "$RUNNER_OS" = Linux
          test ! -d native-ios/out
          echo 'PASS N1s: isolated encrypted staging + Swift tests, no IPA'

