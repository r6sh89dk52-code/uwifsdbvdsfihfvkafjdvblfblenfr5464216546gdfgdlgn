name: DANPER Native - Swift Core Linux
on:
  push:
    branches: [native/swiftui-n1c-durable-journal-linux]
    paths:
      - 'native-ios/**'
      - 'scripts/generate-native-compat-fixtures.cjs'
      - '.github/workflows/native-swift-linux.yml'
  pull_request:
    branches: [native/swiftui-n1b-linux-crypto-restore]
    paths:
      - 'native-ios/**'
      - 'scripts/generate-native-compat-fixtures.cjs'
      - '.github/workflows/native-swift-linux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swift-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verificar Swift
        run: swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar compilador TS para fixtures ficticias
        run: npm ci --no-fund --ignore-scripts
      - name: Generar respaldos cifrados exclusivamente sintéticos
        run: |
          mkdir -p "$RUNNER_TEMP/danper-n1-fixtures"
          echo "DANPER_N1_FIXTURE_DIR=$RUNNER_TEMP/danper-n1-fixtures" >> "$GITHUB_ENV"
          DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-n1-fixtures" node scripts/generate-native-compat-fixtures.cjs
      - name: Pruebas Swift de cifrado y journal persistente N1c
        run: cd native-ios && swift test --jobs 2
      - name: Comprobar ejecución Linux sin empaquetado iOS
        run: |
          test "$RUNNER_OS" = Linux
          test ! -d native-ios/out
          test ! -d native-ios/DANPERNative.xcodeproj
          echo "PASS: Linux only, 0 IPA generated"
