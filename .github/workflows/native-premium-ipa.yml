name: DANPER Premium native IPA - candidate and validation
run-name: Premium native IPA · ${{ github.sha }}
on:
  push:
    branches: [ci/premium-native-ipa-work-20261027]
    paths:
      - '.github/workflows/native-premium-ipa.yml'
      - 'ci/native-ipa-request.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: danper-premium-native-distribution
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
jobs:
  build:
    name: A - Release iphoneos ARM64 and unsigned candidate
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Initialize isolated outputs
        run: |
          echo "BUILD_DIR=$RUNNER_TEMP/danper-native-ipa" >> "$GITHUB_ENV"
          echo "DANPER_N1_FIXTURE_DIR=$RUNNER_TEMP/danper-native-fixtures" >> "$GITHUB_ENV"
      - name: Pinned dependencies, sanitized resources and Xcode project
        run: bash scripts/ci-native-prepare.sh
      - name: Compile physical iPhone Release with Apple signing disabled
        run: |
          set -euo pipefail
          xcodebuild -project native-ios/DANPERNative.xcodeproj -scheme DANPERNative \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$BUILD_DIR/device" -disableAutomaticPackageResolution \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' \
            build 2>&1 | tee "$BUILD_DIR/logs/iphone-release.log"
      - name: Package and independently verify candidate
        run: bash scripts/package-native-premium-ipa.sh
      - name: Publish technically verified candidate, checksum and provenance
        id: candidate
        uses: actions/upload-artifact@v4
        with:
          name: CANDIDATE_UNSIGNED_NOT_CLINICALLY_VALIDATED_${{ github.sha }}
          path: ${{ runner.temp }}/danper-native-ipa/deliverables/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Candidate download and explicit validation status
        env:
          ARTIFACT_URL: ${{ steps.candidate.outputs.artifact-url }}
        run: |
          echo "[Candidate IPA, NOT CLINICALLY VALIDATED]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          cat "$BUILD_DIR/deliverables/SHA256SUMS.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve technical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: A_TECHNICAL_EVIDENCE_${{ github.run_id }}
          path: ${{ runner.temp }}/danper-native-ipa/logs
          retention-days: 14

  clinical:
    name: B - JavaScript and macOS clinical Swift tests
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare clinical fixtures directory and npm dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/clinical/logs"
          echo "BUILD_DIR=$RUNNER_TEMP/clinical" >> "$GITHUB_ENV"
          echo "DANPER_N1_FIXTURE_DIR=$RUNNER_TEMP/fixtures" >> "$GITHUB_ENV"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: JavaScript regression and native contracts
        run: |
          set -euo pipefail
          npm run test:logic 2>&1 | tee "$BUILD_DIR/logs/javascript.log"
          for gate in audit-n2-workspace-routing audit-n2-personal-import audit-n2-build222-backup-restore audit-n2-joint-indicator test-n2-workspace-routing test-n2-build222-ui-parity test-n2-premium-redesign; do
            node "scripts/$gate.cjs" 2>&1 | tee -a "$BUILD_DIR/logs/javascript.log"
          done
      - name: All Swift clinical tests with synthetic fixtures
        if: ${{ !cancelled() }}
        run: bash scripts/ci-native-clinical.sh
      - name: Preserve clinical evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B_CLINICAL_EVIDENCE_${{ github.run_id }}
          path: ${{ runner.temp }}/clinical/logs
          retention-days: 14

  linux:
    name: B2 - Linux portability diagnosis, failures remain visible
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare synthetic fixtures and dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/linux/logs"
          echo "BUILD_DIR=$RUNNER_TEMP/linux" >> "$GITHUB_ENV"
          echo "DANPER_N1_FIXTURE_DIR=$RUNNER_TEMP/fixtures" >> "$GITHUB_ENV"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Complete Linux Swift suite, no assertion suppression
        run: bash scripts/ci-native-clinical.sh
      - name: Preserve portability diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B2_LINUX_EVIDENCE_${{ github.run_id }}
          path: ${{ runner.temp }}/linux/logs
          retention-days: 14

  interaction:
    name: C - Native XCTest and isolated iPhone 16 journeys
    needs: [build, clinical]
    if: ${{ always() && !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Initialize isolated test outputs
        run: |
          echo "BUILD_DIR=$RUNNER_TEMP/interaction" >> "$GITHUB_ENV"
          echo "DANPER_N1_FIXTURE_DIR=$RUNNER_TEMP/fixtures" >> "$GITHUB_ENV"
      - name: Prepare native project and all synthetic fixtures
        run: |
          bash scripts/ci-native-prepare.sh
          bash scripts/ci-native-clinical.sh fixtures-only
      - name: Export historical xcresult attachments for diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh run download 40521728126 -n DANPER_NATIVE_VALIDATION_40521728126 -D "$BUILD_DIR/historical"; then
            xcrun xcresulttool export attachments --path "$BUILD_DIR/historical/Acceptance.xcresult" \
              --output-path "$BUILD_DIR/historical-attachments" > "$BUILD_DIR/logs/historical-export.log" 2>&1 \
              || echo 'Historical attachment export BLOCKED' >> "$BUILD_DIR/logs/historical-export.log"
            rm -rf "$BUILD_DIR/historical"
          else
            echo 'Historical artifact download BLOCKED' > "$BUILD_DIR/logs/historical-export.log"
          fi
      - name: Execute every native and interaction test, isolated by method
        timeout-minutes: 48
        run: bash scripts/ci-native-ui.sh
      - name: Preserve xcresult, screenshots and device logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C_XCTEST_EVIDENCE_${{ github.run_id }}
          path: |
            ${{ runner.temp }}/interaction/logs
            ${{ runner.temp }}/interaction/results
            ${{ runner.temp }}/interaction/historical-attachments
            ${{ runner.temp }}/interaction/ui-methods.txt
          retention-days: 14

  validate:
    name: D - Promote exact tested SHA only when every mandatory job passes
    needs: [build, clinical, linux, interaction]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CANDIDATE_UNSIGNED_NOT_CLINICALLY_VALIDATED_${{ github.sha }}
          path: final
      - name: Verify unchanged IPA checksum and record actual successful gates
        env:
          SOURCE_SHA: ${{ github.sha }}
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          (cd final && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          folder=Path('final');p=folder/'BUILD_PROVENANCE.json';d=json.loads(p.read_text())
          assert d['commit']==os.environ['SOURCE_SHA']
          gates=json.loads(os.environ['GATE_RESULTS'])
          assert all(v['result']=='success' for v in gates.values()),gates
          ipa=folder/d['ipa'];assert hashlib.sha256(ipa.read_bytes()).hexdigest()==d['sha256']
          with zipfile.ZipFile(ipa) as z: assert z.testzip() is None
          d['status']='VALIDATED_UNSIGNED';d['validation']={k:'PASS' for k in gates}
          d['evidence_run_url']=d['run_url'];d['promotion']='Exact same IPA bytes as candidate, all mandatory jobs successful'
          p.write_text(json.dumps(d,indent=2)+'\n')
          (folder/'VALIDATED_SHA.txt').write_text(d['commit']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: VALIDATED_UNSIGNED_${{ github.sha }}
          path: final/*
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
