name: DANPER - validacion del codigo en PR
on:
  pull_request:
    branches: [main, release/v0.21.9-shared-stock-closure]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias
        run: npm ci --no-fund
      - name: Pruebas de logica
        run: npm run test:logic
      - name: Validacion TypeScript y Vite
        run: npm run build
      - name: Auditoria de dependencias
        run: npm audit --audit-level=high
      - name: Comprobar preparación iOS
        run: npm run ios:check
