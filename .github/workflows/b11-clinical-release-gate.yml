name: B14 - resume verified gates and iLoader IPA
on:
  pull_request:
    paths:
      - 'native-ios/**'
      - 'scripts/**'
      - 'src/portableBackup.ts'
      - '.github/workflows/b11-clinical-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: b14-resume-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verified-evidence:
    if: github.head_ref == 'fix/kardex-opening-history-build14-20261029' || github.ref == 'refs/heads/fix/kardex-opening-history-build14-20261029'
    name: Verify immutable 417 Swift, Excel, Xcode, 26 native and 9 UI results
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Recover immutable proof of completed Swift, native and seven UI suites
        uses: actions/download-artifact@v4
        with:
          name: B14_BASELINE_PROOF
          run-id: 41067439602
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/b14-baseline/proof
      - name: Recover the two newly-passed N3 demo cases
        uses: actions/download-artifact@v4
        with:
          name: B14_REPLAY_RESULT_N3ClinicalJourneyTests-demo
          run-id: 41067439602
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/b14-baseline/demo
      - name: Require unchanged application and test inputs; retain actual failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/glass-audit/resume-build14.py baseline "$RUNNER_TEMP/b14-baseline" "$RUNNER_TEMP/b14-proof"
      - uses: actions/upload-artifact@v4
        with:
          name: B14_BASELINE_PROOF
          path: ${{ runner.temp }}/b14-proof
          if-no-files-found: error
          retention-days: 14

  build14-ipa:
    name: Package Build 14 only after combined 417 Swift, 26 native and 11 UI pass
    needs: verified-evidence
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: B14_BASELINE_PROOF
          path: ${{ runner.temp }}/b14-combined/baseline
      - name: Recover unchanged genuine biometric pass
        uses: actions/download-artifact@v4
        with:
          name: B14_REPLAY_RESULT_N2BiometricInteractionTests
          run-id: 41078523104
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/b14-combined/B14_REPLAY_RESULT_N2BiometricInteractionTests
      - name: Recover unchanged protected clinical journey pass
        uses: actions/download-artifact@v4
        with:
          name: B14_REPLAY_RESULT_N3ClinicalJourneyTests-protected
          run-id: 41078523104
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/b14-combined/B14_REPLAY_RESULT_N3ClinicalJourneyTests-protected
      - name: Require exact source identity and full zero-failure combined coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/glass-audit/resume-build14.py final "$RUNNER_TEMP/b14-combined" "$RUNNER_TEMP/build14-release"
          node scripts/glass-audit/verify-build13-upgrade.cjs
          node scripts/glass-audit/identity.cjs
      - name: Prepare distribution resources and Xcode
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          node scripts/prepare-n1s-ios-demo-resources.cjs
          (cd native-ios && bash scripts/make-app-icon.sh && xcodegen generate --spec project.yml)
      - name: Require JavaScript regressions and build unsigned Release ARM64
        env:
          DANPER_AUDIT_OUT: ${{ runner.temp }}/build14-release
        run: |
          set -euo pipefail
          node scripts/glass-audit/javascript.cjs
          bash scripts/glass-audit/package-macos.sh
          cp "$DANPER_AUDIT_OUT/javascript-results.json" "$DANPER_AUDIT_OUT/ipa/"
          cp "$DANPER_AUDIT_OUT/ALL_GATES.json" "$DANPER_AUDIT_OUT/ipa/"
      - name: Publish verified Build 14 iLoader candidate
        uses: actions/upload-artifact@v4
        with:
          name: DANPER_BUILD14_ILOADER_UNSIGNED_${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/build14-release/ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B14_PACKAGING_DIAGNOSTICS
          path: |
            ${{ runner.temp }}/build14-release/*.log
            ${{ runner.temp }}/build14-release/*.json
            ${{ runner.temp }}/build14-release/*.txt
          retention-days: 7
