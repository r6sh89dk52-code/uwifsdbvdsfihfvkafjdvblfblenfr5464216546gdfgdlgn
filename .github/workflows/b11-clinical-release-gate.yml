name: B14 - Clinical Parity Gate and gated iLoader IPA
on:
  push:
    branches:
      - fix/b10-trabajadores-exportacion-ux-20261018
    paths:
      - 'native-ios/**'
      - 'scripts/**'
      - 'src/portableBackup.ts'
      - '.github/workflows/b11-clinical-release-gate.yml'
  pull_request:
    paths:
      - 'native-ios/**'
      - 'scripts/**'
      - 'src/portableBackup.ts'
      - '.github/workflows/b11-clinical-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b11-clinical-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-swift:
    name: Swift core and synthetic clinical regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and inspect static clinical gates
        run: |
          npm ci --ignore-scripts --no-fund
          node scripts/audit-n2-workspace-routing.cjs
          node scripts/audit-n2-personal-import.cjs
          node scripts/audit-n2-build222-backup-restore.cjs
          node scripts/audit-n2-joint-indicator.cjs
      - name: Generate synthetic fixture source only (never personal data)
        run: |
          mkdir -p "$RUNNER_TEMP/danper-b11-fixtures"
          echo "DANPER_N1_FIXTURE_DIR=$RUNNER_TEMP/danper-b11-fixtures" >> "$GITHUB_ENV"
          for generator in \
            generate-native-compat-fixtures.cjs \
            generate-n1e-clinical-fixtures.cjs \
            generate-n1f-lossless-fixtures.cjs \
            generate-n1h-clinical-parity.cjs \
            generate-n1p-excel-parity.cjs \
            generate-n1q-reconciliation-fixtures.cjs \
            generate-n1r-stored-xlsx-template.cjs \
            generate-n1s-official-excel-fixtures.cjs \
            generate-n2-approved-fixture.cjs \
            generate-n2-nursing-parity.cjs \
            generate-n2-stock-commands-fixtures.cjs; do
            DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-b11-fixtures" node "scripts/$generator"
          done
          DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-b11-fixtures" node scripts/generate-n2-procedure-parity.cjs
      - name: Swift 6 Linux syntax of iOS views + all core XCTest suites
        run: |
          set -o pipefail
          swift --version
          swiftc -frontend -parse native-ios/App/*.swift
          cd native-ios
          swift test --jobs 2 2>&1 | tee "$RUNNER_TEMP/b11-linux-swift-test.log"
      - name: Verify both native Excel workbooks against TypeScript originals
        run: |
          node scripts/test-n1r-native-xlsx.cjs
          node scripts/test-n1s-full-native-workbooks.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B14_LINUX_SWIFT_EXCEL_DIAGNOSTICS
          path: ${{ runner.temp }}/b11-linux-swift-test.log
          retention-days: 7
          if-no-files-found: ignore

  macos-swiftui:
    name: Xcode B11 compile + backup and UI XCTest
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Xcode runtime and dependencies
        run: |
          xcodebuild -version
          npm ci --ignore-scripts --no-fund
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Check native source routing and encrypted backup compatibility
        run: |
          node scripts/audit-n2-workspace-routing.cjs
          node scripts/audit-n2-personal-import.cjs
          node scripts/audit-n2-build222-backup-restore.cjs
          node scripts/audit-n2-joint-indicator.cjs
          node scripts/prepare-n1s-ios-demo-resources.cjs
          test "$(grep -c 'N2OfficialArea(site:' native-ios/App/N2GeneratedOfficialAreas.swift)" = 155
      - name: Generate Xcode project
        working-directory: native-ios
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -resolvePackageDependencies -project DANPERNative.xcodeproj -scheme DANPERNative
      - name: Build actual SwiftUI native iPhone app for simulator (unsigned)
        working-directory: native-ios
        run: |
          xcodebuild -project DANPERNative.xcodeproj -scheme DANPERNative \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/b11-xcode" \
            CODE_SIGNING_ALLOWED=NO ASSETCATALOG_COMPILER_APPICON_NAME="" build > "$RUNNER_TEMP/b11-ios-compile.log" 2>&1 || {
              grep -nE '(error:|fatal error:|BUILD FAILED)' "$RUNNER_TEMP/b11-ios-compile.log" | tail -n 100 || true
              exit 1
            }
          echo "PASS: B11 SwiftUI compiled with real Xcode type checker."
      - name: All native and UI tests on isolated enrolled iPhone 16 simulators
        timeout-minutes: 80
        env:
          DANPER_AUDIT_OUT: ${{ runner.temp }}/b14-simulator-evidence
          DANPER_AUDIT_DERIVED_DATA: ${{ runner.temp }}/b11-xcode
        run: bash scripts/glass-audit/validate-macos.sh current
      - name: Reassert zero release artifacts and existing build222 isolation
        run: |
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER: pe.danper.saludmovil.native.iloaderpreview' native-ios/project.yml
          test ! -d native-preview-artifacts
          test ! -d native-ios/outputs
          echo "PASS: B11 compile and simulator tests only, no IPA, no production overwrite."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B11_MACOS_XCODE_DIAGNOSTICS_ONLY
          path: |
            ${{ runner.temp }}/b11-ios-compile.log
            ${{ runner.temp }}/b14-simulator-evidence
            !${{ runner.temp }}/b14-simulator-evidence/DerivedData/**
          retention-days: 7
          if-no-files-found: warn

  build14-ipa:
    name: Build 14 unsigned iLoader IPA after all mandatory gates
    needs: [linux-swift, macos-swiftui]
    if: github.event.pull_request.head.ref == 'fix/kardex-opening-history-build14-20261029' || github.ref == 'refs/heads/fix/kardex-opening-history-build14-20261029'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify same Build 13 storage and signing identity
        run: |
          set -euo pipefail
          node scripts/glass-audit/verify-build13-upgrade.cjs
          node scripts/glass-audit/identity.cjs
      - name: Prepare distribution resources and Xcode
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          node scripts/prepare-n1s-ios-demo-resources.cjs
          (cd native-ios && bash scripts/make-app-icon.sh && xcodegen generate --spec project.yml)
      - name: Require JavaScript regressions and package validated Release ARM64
        env:
          DANPER_AUDIT_OUT: ${{ runner.temp }}/build14-release
        run: |
          set -euo pipefail
          mkdir -p "$DANPER_AUDIT_OUT"
          node scripts/glass-audit/javascript.cjs
          # Both required jobs above tested precisely this source SHA.
          git rev-parse HEAD > "$DANPER_AUDIT_OUT/VALIDATED_SHA.txt"
          bash scripts/glass-audit/package-macos.sh
          cp "$DANPER_AUDIT_OUT/javascript-results.json" "$DANPER_AUDIT_OUT/ipa/"
      - name: Publish verified Build 14 iLoader candidate
        uses: actions/upload-artifact@v4
        with:
          name: DANPER_BUILD14_ILOADER_UNSIGNED_${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/build14-release/ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B14_PACKAGING_DIAGNOSTICS
          path: |
            ${{ runner.temp }}/build14-release/*.log
            ${{ runner.temp }}/build14-release/*.json
          retention-days: 7
