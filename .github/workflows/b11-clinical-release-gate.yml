name: B11 - Clinical Parity Gate (NO IPA)
on:
  push:
    branches:
      - fix/b10-trabajadores-exportacion-ux-20261018
    paths:
      - 'native-ios/**'
      - 'scripts/**'
      - 'src/portableBackup.ts'
      - '.github/workflows/b11-clinical-release-gate.yml'
  pull_request:
    paths:
      - 'native-ios/**'
      - 'scripts/**'
      - 'src/portableBackup.ts'
      - '.github/workflows/b11-clinical-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b11-clinical-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-swift:
    name: Swift core and synthetic clinical regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and inspect static clinical gates
        run: |
          npm ci --ignore-scripts --no-fund
          node scripts/audit-n2-workspace-routing.cjs
          node scripts/audit-n2-personal-import.cjs
          node scripts/audit-n2-build222-backup-restore.cjs
          node scripts/audit-n2-joint-indicator.cjs
          node scripts/test-n2-workspace-routing.cjs
          node scripts/test-n2-build222-ui-parity.cjs
      - name: Generate synthetic fixture source only (never personal data)
        run: |
          mkdir -p "$RUNNER_TEMP/danper-b11-fixtures"
          echo "DANPER_N1_FIXTURE_DIR=$RUNNER_TEMP/danper-b11-fixtures" >> "$GITHUB_ENV"
          for generator in \
            generate-native-compat-fixtures.cjs \
            generate-n1e-clinical-fixtures.cjs \
            generate-n1f-lossless-fixtures.cjs \
            generate-n1h-clinical-parity.cjs \
            generate-n1p-excel-parity.cjs \
            generate-n1q-reconciliation-fixtures.cjs \
            generate-n1r-stored-xlsx-template.cjs \
            generate-n1s-official-excel-fixtures.cjs \
            generate-n2-approved-fixture.cjs \
            generate-n2-nursing-parity.cjs \
            generate-n2-stock-commands-fixtures.cjs; do
            DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-b11-fixtures" node "scripts/$generator"
          done
          DANPER_N1_FIXTURE_DIR="$RUNNER_TEMP/danper-b11-fixtures" node scripts/generate-n2-procedure-parity.cjs
      - name: Swift 6 Linux syntax of iOS views + all core XCTest suites
        run: |
          set -euo pipefail
          swift --version
          swiftc -frontend -parse native-ios/App/*.swift
          cd native-ios
          swift test --jobs 2 2>&1 | tee "$RUNNER_TEMP/b11-linux-swift-test.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: B11_FAILED_LINUX_COMPILER_DIAGNOSTICS
          path: ${{ runner.temp }}/b11-linux-swift-test.log
          retention-days: 7
          if-no-files-found: ignore

  macos-swiftui:
    name: Xcode B11 compile + backup and UI XCTest
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Xcode runtime and dependencies
        run: |
          xcodebuild -version
          npm ci --ignore-scripts --no-fund
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Check native source routing and encrypted backup compatibility
        run: |
          node scripts/audit-n2-workspace-routing.cjs
          node scripts/audit-n2-personal-import.cjs
          node scripts/audit-n2-build222-backup-restore.cjs
          node scripts/audit-n2-joint-indicator.cjs
          node scripts/prepare-n1s-ios-demo-resources.cjs
          test "$(grep -c 'N2OfficialArea(site:' native-ios/App/N2GeneratedOfficialAreas.swift)" = 155
      - name: Generate Xcode project
        working-directory: native-ios
        run: |
          bash scripts/make-app-icon.sh
          xcodegen generate --spec project.yml
          xcodebuild -resolvePackageDependencies -project DANPERNative.xcodeproj -scheme DANPERNative
      - name: Build actual SwiftUI native iPhone app for simulator (unsigned)
        working-directory: native-ios
        run: |
          xcodebuild -project DANPERNative.xcodeproj -scheme DANPERNative \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/b11-xcode" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/b11-ios-compile.log" 2>&1 || {
              grep -nE '(error:|fatal error:|BUILD FAILED)' "$RUNNER_TEMP/b11-ios-compile.log" | tail -n 100 || true
              exit 1
            }
          echo "PASS: B11 SwiftUI compiled with real Xcode type checker."
      - name: Test native backup cipher and UI with clean simulator
        working-directory: native-ios
        timeout-minutes: 20
        run: |
          SIM="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"] == "iPhone 16" and d["isAvailable"]]; print(devices[0]["udid"] if devices else "")')"
          test -n "$SIM" || { echo "No suitable iPhone simulator: NOT PASS"; exit 1; }
          xcodebuild -project DANPERNative.xcodeproj -scheme DANPERNative \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM" \
            -destination-timeout 180 -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/b11-xcode" \
            -resultBundlePath "$RUNNER_TEMP/b11-layout.xcresult" \
            CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/b11-ios-tests.log" 2>&1 || {
              grep -nE '(error:|failed|FAIL|Testing failed)' "$RUNNER_TEMP/b11-ios-tests.log" | tail -n 120 || true
              exit 1
            }
          grep -q 'TEST SUCCEEDED' "$RUNNER_TEMP/b11-ios-tests.log"
      - name: Capture base Access and Home for real before-after comparison
        if: github.head_ref == 'design/glass-clinical-access-home-20261027' || github.ref_name == 'design/glass-clinical-access-home-20261027'
        working-directory: native-ios
        timeout-minutes: 12
        run: |
          set -euo pipefail
          BASE=9bec8e01ccbb3f1a674372cf6e48df049dc4f014
          git fetch --no-tags --depth=1 origin "$BASE"
          trap 'git restore -- App/DANPERNativeApp.swift App/N2ClinicalWorkspaceView.swift' EXIT
          git show "$BASE:native-ios/App/DANPERNativeApp.swift" > App/DANPERNativeApp.swift
          git show "$BASE:native-ios/App/N2ClinicalWorkspaceView.swift" > App/N2ClinicalWorkspaceView.swift
          SIM="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"] == "iPhone 16" and d["isAvailable"]]; print(devices[0]["udid"] if devices else "")')"
          test -n "$SIM"
          xcodebuild -project DANPERNative.xcodeproj -scheme DANPERNative \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM" \
            -destination-timeout 180 -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/b11-xcode" \
            -resultBundlePath "$RUNNER_TEMP/b11-before-layout.xcresult" \
            -only-testing:DANPERNativeTests/N2GlassClinicalLayoutTests \
            CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/b11-before-layout.log" 2>&1 || {
              tail -n 100 "$RUNNER_TEMP/b11-before-layout.log"
              exit 1
            }
          grep -q 'TEST SUCCEEDED' "$RUNNER_TEMP/b11-before-layout.log"
      - name: Export real iPhone 16 layout evidence
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/b11-layout.xcresult"; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/b11-layout.xcresult" --output-path "$RUNNER_TEMP/b11-layout-png"
          fi
          if test -d "$RUNNER_TEMP/b11-before-layout.xcresult"; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/b11-before-layout.xcresult" --output-path "$RUNNER_TEMP/b11-before-layout-png"
          fi
      - name: Reassert zero release artifacts and existing build222 isolation
        run: |
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER: pe.danper.saludmovil.native.preview' native-ios/project.yml
          test ! -d native-preview-artifacts
          test ! -d native-ios/outputs
          echo "PASS: B11 compile and simulator tests only, no IPA, no production overwrite."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B11_MACOS_XCODE_DIAGNOSTICS_ONLY
          path: |
            ${{ runner.temp }}/b11-ios-compile.log
            ${{ runner.temp }}/b11-ios-tests.log
            ${{ runner.temp }}/b11-layout.xcresult
            ${{ runner.temp }}/b11-layout-png
            ${{ runner.temp }}/b11-before-layout.log
            ${{ runner.temp }}/b11-before-layout.xcresult
            ${{ runner.temp }}/b11-before-layout-png
          retention-days: 7
          if-no-files-found: warn
