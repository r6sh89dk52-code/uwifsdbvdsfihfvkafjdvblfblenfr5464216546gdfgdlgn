name: B15 - 9648-worker real UI regression (NO release approval)
'on':
  push:
    branches: [audit/b15-large-ui-4daba96-20261103]
    paths: [.github/workflows/b15-large-ui.yml, native-ios/NativeTests/N2LargeRosterProfileFixture.swift, scripts/performance/prepare_large_ui_harness.py, scripts/performance/verify_large_ui_products.py]
permissions:
  contents: read
jobs:
  actual-large-ui:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      DANPER_EXPECTED_BUILD: '15'
    steps:
      - uses: actions/checkout@v4
        with: {path: load-harness}
      - uses: actions/checkout@v4
        with:
          ref: 4daba9649824b58dedc57721d8cd1ad5af035963
          path: current
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Compile current product source with diagnostic tests only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/large-ui-results"
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          cd current
          npm ci --ignore-scripts --no-fund > "$RUNNER_TEMP/large-ui-results/npm.log" 2>&1
          node scripts/prepare-n1s-ios-demo-resources.cjs > "$RUNNER_TEMP/large-ui-results/resources.log" 2>&1
          python3 ../load-harness/scripts/performance/prepare_large_ui_harness.py
          git diff --exit-code HEAD -- native-ios/App native-ios/Sources native-ios/project.yml
          (cd native-ios && bash scripts/make-app-icon.sh && xcodegen generate --spec project.yml)
          xcodebuild -project native-ios/DANPERNative.xcodeproj -scheme DANPERNative -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/large-ui-derived" ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES ENABLE_TESTABILITY=YES ASSETCATALOG_COMPILER_APPICON_NAME="" build-for-testing > "$RUNNER_TEMP/large-ui-results/build.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/large-ui-results/build.log"; exit 1; }
          python3 scripts/performance/verify_large_ui_products.py seal "$RUNNER_TEMP/large-ui-derived/Build/Products" "$RUNNER_TEMP/large-ui-proof.json"
      - name: Real empty-search last-worker allergy autosave reopen UI; preserve complete original data
        env:
          DANPER_AUDIT_OUT: ${{ runner.temp }}/large-ui-results
          DANPER_AUDIT_DERIVED_DATA: ${{ runner.temp }}/large-ui-derived
          DANPER_TEST_PROOF: ${{ runner.temp }}/large-ui-proof.json
          DANPER_B15_UI_LABEL: Large-9648-UI-diagnostic
        run: |
          set -euo pipefail
          cd current
          bash scripts/glass-audit/validate-macos.sh b15-profile
      - name: Require actual complete results and retain timing limitations
        if: always()
        run: |
          python3 - <<'PY'
          import json,math,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'large-ui-results'
          report={'sourceSHA':'4daba9649824b58dedc57721d8cd1ad5af035963','scope':'iPhone16/iOS18.5 Debug Simulator; 9648 fictional workers/1005 saved visits; diagnostic UI runner, production App/Core sources unchanged','fullAppApproved':False,'IPA':False,'physicalDeviceMeasured':False,'latencySamples':1,'p95':None,'limitation':'Save interval includes XCTest tap helper, scroll/query/idle overhead; search includes typing/automation. Not pure app latency, no matched baseline.'}
          try:
           assert (root/'SOURCE_SHA.txt').read_text().strip()==report['sourceSHA']
           for name,n in [('biometric-preflight',1),('large-seed',1),('original-fixtures',2),('large-invariants-before',1),('large-ui',3),('large-invariants-after',1)]:
            d=json.loads((root/(name+'.xcresult.summary.json')).read_text());assert d['passedTests']==d['totalTestCount']==n and d['failedTests']==d['skippedTests']==0 and not d.get('testFailures'),name
           s=(root/'large-ui.log').read_text()
           for key,marker in [('automatedSaveConfirmationMS','DANPER_LARGE_UI_SAVE_MS'),('automatedLastSearchMS','DANPER_LARGE_UI_LAST_SEARCH_MS')]:
            values=re.findall(marker+r' ([0-9.]+)',s);assert len(values)==1,marker
            report[key]=float(values[0]);assert math.isfinite(report[key]) and report[key]>0
           report.update(uiPassed=3,uiFailed=0,uiSkipped=0,completeOriginalPhysicalWorkersHistoryDraftPreserved=True,successful=True)
          except Exception as e:report.update(successful=False,error=str(e))
          (root/'LARGE_UI_RESULT.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2));assert report['successful']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B15_9648_REAL_UI_NOT_RELEASE_APPROVAL
          path: |
            ${{ runner.temp }}/large-ui-results/*.json
            ${{ runner.temp }}/large-ui-results/*.txt
            ${{ runner.temp }}/large-ui-results/*.log
            ${{ runner.temp }}/large-ui-results/*-failure-attachments.tgz
            ${{ runner.temp }}/large-ui-proof.json
          retention-days: 14
