name: DANPER Native - Xcode Integration Audit (NO IPA)
on:
  push:
    branches: [native/swiftui-n1s-complete-excel-and-container-gate]
    paths:
      - 'native-ios/**'
      - '.github/workflows/native-swiftui-xcode-audit.yml'
  pull_request:
    branches: [native/swiftui-n1s-complete-excel-and-container-gate]
    paths:
      - 'native-ios/**'
      - '.github/workflows/native-swiftui-xcode-audit.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: danper-native-n1s-xcode-${{ github.ref }}
  cancel-in-progress: true
jobs:
  xcode-audit:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout isolated native SwiftUI source
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen if missing
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Ensure isolated app identifier, no production overwrite
        run: |
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER: pe.danper.saludmovil.native.preview' native-ios/project.yml
          ! grep -q 'PRODUCT_BUNDLE_IDENTIFIER: pe.danper.saludmovil.prototipo' native-ios/project.yml
          grep -q 'INFOPLIST_KEY_NSFaceIDUsageDescription' native-ios/project.yml
          test -f native-ios/App/NativeFirstRunOnboarding.swift
          test -f native-ios/App/Assets.xcassets/BrandLogo.imageset/danper-logo.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble isolated synthetic N1s workbook templates for iPhone preview
        run: |
          npm ci --no-fund --ignore-scripts
          node scripts/prepare-n1s-ios-demo-resources.cjs
          test -f native-ios/App/N1sDemoResources/n1s-indicator-plan.json
          test -f native-ios/App/N1sDemoResources/n1s-nursing-plan.json
          test -f native-ios/App/N1sDemoResources/n2-synthetic-clinical.json
          test -f native-ios/App/N1sDemoResources/n2-ambulatory-products.json
          test -f native-ios/App/N1sDemoResources/n2-nursing-catalog.json
          test -f native-ios/App/N1sDemoResources/n2-approved-mappings.json
      - name: Generate native Xcode project and official icon
        working-directory: native-ios
        run: |
          bash scripts/make-app-icon.sh
          xcodegen generate --spec project.yml
          test -d DANPERNative.xcodeproj
          xcodebuild -list -project DANPERNative.xcodeproj
      - name: Compile actual SwiftUI app for iOS Simulator (unsigned)
        working-directory: native-ios
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/danper-xcode-simulator"
          xcodebuild \
            -project DANPERNative.xcodeproj \
            -scheme DANPERNative \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/danper-xcode-simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > "$RUNNER_TEMP/n1k-simulator-build.log" 2>&1 || {
              grep -E -A 5 '(error:|error generated|BUILD FAILED|could not resolve|failed)' "$RUNNER_TEMP/n1k-simulator-build.log" | tail -n 120 || true
              exit 1
            }
          test -d "$RUNNER_TEMP/danper-xcode-simulator/Build/Products/Debug-iphonesimulator/DANPERNative.app"
          test -f "$RUNNER_TEMP/danper-xcode-simulator/Build/Products/Debug-iphonesimulator/DANPERNative.app/N1sDemoResources/n1s-indicator-plan.json"
          test -f "$RUNNER_TEMP/danper-xcode-simulator/Build/Products/Debug-iphonesimulator/DANPERNative.app/N1sDemoResources/n1s-nursing-template-store.zip"
          test -f "$RUNNER_TEMP/danper-xcode-simulator/Build/Products/Debug-iphonesimulator/DANPERNative.app/N1sDemoResources/n2-synthetic-clinical.json"
          test -f "$RUNNER_TEMP/danper-xcode-simulator/Build/Products/Debug-iphonesimulator/DANPERNative.app/N1sDemoResources/n2-nursing-catalog.json"
          test -f "$RUNNER_TEMP/danper-xcode-simulator/Build/Products/Debug-iphonesimulator/DANPERNative.app/N1sDemoResources/n2-approved-mappings.json"
          echo 'PASS: real Xcode SwiftUI/iOS Simulator compilation (no installation).'
      - name: Compile for generic iPhone with signing disabled (no archive)
        working-directory: native-ios
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/danper-xcode-iphone"
          xcodebuild \
            -project DANPERNative.xcodeproj \
            -scheme DANPERNative \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/danper-xcode-iphone" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > "$RUNNER_TEMP/n1k-iphone-build.log" 2>&1 || {
              grep -E -A 5 '(error:|error generated|BUILD FAILED|could not resolve|failed)' "$RUNNER_TEMP/n1k-iphone-build.log" | tail -n 120 || true
              exit 1
            }
          test -d "$RUNNER_TEMP/danper-xcode-iphone/Build/Products/Debug-iphoneos/DANPERNative.app"
          echo 'PASS: real Xcode generic iPhone compilation (unsigned, no IPA).'
      - name: Run real iOS Simulator XCTest for portable .danperbackup interop
        working-directory: native-ios
        timeout-minutes: 15
        run: |
          set -euo pipefail
          SIM_ID="$(xcrun simctl list devices available | sed -nE 's/.*iPhone[^()]*\(([0-9A-F-]{36})\).*/\1/p' | head -n 1)"
          test -n "$SIM_ID" || { echo 'No available iPhone Simulator device; test is NOT waived.'; exit 1; }
          xcodebuild \
            -project DANPERNative.xcodeproj \
            -scheme DANPERNative \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -resultBundlePath "$RUNNER_TEMP/danper-layout.xcresult" \
            -destination-timeout 180 \
            -parallel-testing-enabled NO \
            -derivedDataPath "$RUNNER_TEMP/danper-xcode-simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test > "$RUNNER_TEMP/n2-ios-xctest.log" 2>&1 || {
              grep -E -A 7 '(error:|failed|FAIL|TEST FAILED|Testing failed)' "$RUNNER_TEMP/n2-ios-xctest.log" | tail -n 150 || true
              exit 1
            }
          grep -q 'TEST SUCCEEDED' "$RUNNER_TEMP/n2-ios-xctest.log"
          echo 'PASS N2: iOS simulator portable backup native→build222 reader roundtrip.'
      - name: Audit app privacy metadata and zero IPA packaging
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/danper-xcode-iphone/Build/Products/Debug-iphoneos/DANPERNative.app"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test "$BUNDLE" = 'pe.danper.saludmovil.native.preview'
          /usr/libexec/PlistBuddy -c 'Print :NSFaceIDUsageDescription' "$APP/Info.plist" >/dev/null
          test ! -d outputs
          test ! -d native-ios/outputs
          test ! -d native-ios/DANPERNative.xcarchive
          echo 'PASS: native preview bundle verified, Face ID purpose text present.'
          echo 'PASS: NO signed installer, NO IPA, NO uploaded binary and NO iPhone installation.'

      - name: Extract simulator layout PNG attachments
        if: success()
        run: |
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/danper-layout.xcresult" --output-path "$RUNNER_TEMP/danper-layout-png"
      - name: Publish simulator XCTest layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DANPER_SWIFTUI_SIMULATOR_TEST_EVIDENCE
          path: |
            ${{ runner.temp }}/danper-layout-png
            ${{ runner.temp }}/danper-layout.xcresult
            ${{ runner.temp }}/n2-ios-xctest.log
          if-no-files-found: warn
          retention-days: 7
