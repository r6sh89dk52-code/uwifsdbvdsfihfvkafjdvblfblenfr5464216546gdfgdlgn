name: B15 - absent clinical source and storage error regressions (NOT app approval)
on:
  push:
    branches: [audit/b15-clinical-source-load-1419703-20261102]
    paths: ['native-ios/**', 'scripts/performance/**', '.github/workflows/b15-clinical-source-evidence.yml']
permissions:
  contents: read
jobs:
  focused-source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with: {swift-version: '6.0.3'}
      - name: Parse App syntax and execute four real filesystem/error regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-evidence"
          swiftc -frontend -parse native-ios/App/*.swift
          (cd native-ios && swift test --jobs 2 --filter N2ClinicalSourceEvidenceTests) 2>&1 | tee "$RUNNER_TEMP/source-evidence/swift-focused.log"
          python3 -m unittest discover -s scripts/performance/tests -v 2>&1 | tee "$RUNNER_TEMP/source-evidence/python.log"
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'source-evidence'
          text=(out/'swift-focused.log').read_text()
          assert re.search(r'Executed 4 tests, with 0 failures',text) and not re.search(r'Test Case .* skipped',text)
          py=(out/'python.log').read_text();match=re.search(r'Ran (\d+) tests',py)
          assert match and int(match[1])>=37 and '\nOK\n' in py
          report={'sourceSHA':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'focusedSwiftTests':4,'pythonTests':int(match[1]),'failures':0,
            'scope':'Four storage-evidence regressions and harness tests; App parse is syntax only, not Xcode typecheck',
            'applicationApproval':False,'physicalDeviceValidated':False,'IPA':False}
          (out/'FOCUSED_RESULTS.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B15_CLINICAL_SOURCE_EVIDENCE_NOT_APP_APPROVAL
          path: ${{ runner.temp }}/source-evidence
          retention-days: 14
