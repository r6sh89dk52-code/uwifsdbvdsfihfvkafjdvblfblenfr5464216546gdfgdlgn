name: DANPER Salud Movil - IPA build222 (unica autorizada)
# Temporary: triggered by the single creation of THIS file.
on:
  push:
    branches: [release/v0.21.12-build222-provisional-consumptions]
    paths:
      - '.github/workflows/ios-222-one-shot.yml'
permissions:
  contents: read
# One explicitly authorized build222. Delete immediately after the run finishes.
# Subsequent commits MUST NOT satisfy the one-shot message condition.
jobs:
  ipa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v0.21.12-build222-provisional-consumptions' && contains(github.event.head_commit.message, 'trigger authorized one-shot macOS build222')
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Version de Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Garantizar CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then brew install cocoapods; fi
          pod --version
      - name: Instalar dependencias npm
        run: npm ci --no-fund
      - name: Pruebas de lógica
        run: npm run test:logic
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
      - name: Comprobar preparación iOS
        run: npm run ios:check
      - name: Compilar aplicación web
        run: npm run build
      - name: Generar proyecto iOS
        run: |
          npx cap add ios
          npx cap sync ios
          node scripts/install-ios-gesture.mjs
          node scripts/install-ios-access-lock.mjs
      - name: Generar IPA sin firmar
        run: bash scripts/build-ios-ipa.sh
      - name: Verificar IPA y recursos
        run: node scripts/verify-ios-ipa.mjs
      - name: Adjuntar IPA descargable
        uses: actions/upload-artifact@v4
        with:
          name: DANPER-Salud-Movil-iPhone-v0.21.12-BUILD-222-CONSUMOS-HISTORICOS-PROVISIONALES
          path: |
            outputs/*.ipa
            outputs/*.sha256
          if-no-files-found: error
          retention-days: 7
